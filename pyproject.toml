[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# UP037: quoted forward-refs are the correct SQLAlchemy idiom (avoid circular imports).
# DTZ011/DTZ012: date defaults are intentionally naive (calendar dates).
# B008: Depends()/require_roles() in defaults is FastAPI's standard DI idiom.
ignore = ["UP037", "DTZ011", "DTZ012", "B008"]

[tool.ruff.lint.per-file-ignores]
# F821: forward-ref class names are resolved by SQLAlchemy's registry at mapper
# configuration; not imported at module scope to avoid circular imports.
"backend/src/student_management/models/*.py" = ["F821"]